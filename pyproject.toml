[project]
name = "demurrage"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "SIlvia Romanato", email = "80218776+silvipilvi@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = []

[project.scripts]
demurrage = "demurrage:main"

[build-system]
requires = ["uv_build>=0.13.0,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "ruff>=0.17.0",
]

[tool.ruff]
target-version = "py312"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.format]
quote-style = "double"
